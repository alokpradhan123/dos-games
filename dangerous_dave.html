<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dangerous Dave Arcade</title>
    <link rel="stylesheet" href="js-dos.css">
    <script src="js-dos.js"></script>
    <style>
        html, body, #jsdos { width: 100%; height: 100%; margin: 0; padding: 0; background: black; }
    </style>
</head>
<body>
    <div id="jsdos"></div>
    <script>
        // No more "Error: Engine failed" because it's in your folder!
        Dos(document.getElementById("jsdos")).run("DDAVEVGA.zip").then((ci) => {
            ci.terminal(["DAVE.EXE"]);
        });
    </script>
</body>
</html>
