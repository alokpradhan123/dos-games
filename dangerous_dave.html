<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dangerous Dave Arcade</title>
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos.js"></script>
    <style>
        html, body, #jsdos { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            background: black; color: white; display: flex; 
            justify-content: center; align-items: center; 
        }
        canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
    </style>
</head>
<body>
    <div id="jsdos"></div>
    <script>
        // We add a tiny 'cache-buster' (?v=1) to force GitHub to send the fresh file
        Dos(document.getElementById("jsdos")).run("DDAVEVGA.zip?v=1").then((ci) => {
            // This is the direct command to start Dave
            ci.terminal(["DAVE.EXE"]);
        });
    </script>
</body>
</html>
