<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dangerous Dave Arcade</title>
    <link rel="stylesheet" href="https://js-dos.com/v7/build/js-dos.css">
    <script src="https://js-dos.com/v7/build/js-dos.js"></script>
    <style>
        html, body, #jsdos { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: black; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="jsdos">Loading Arcade Assets...</div>
    <script>
        // Tell the emulator where to find its core files
        emulators.pathPrefix = "https://js-dos.com/v7/build/";

        Dos(document.getElementById("jsdos"))
            .run("DDAVEVGA.zip") // Matches your exact ZIP name
            .then((ci) => {
                console.log("Game Loaded!");
            });
    </script>
</body>
</html>
