<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dangerous Dave Arcade</title>
    <script src="https://cdn.jsdelivr.net/gh/js-dos/pwa@main/js-dos.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/js-dos/pwa@main/js-dos.css" rel="stylesheet">
    <style>
        html, body, #jsdos { 
            width: 100%; height: 100%; margin: 0; padding: 0; 
            background: black; color: white;
        }
    </style>
</head>
<body>
    <div id="jsdos"></div>
    <script>
        // We check if the engine loaded correctly first
        if (typeof Dos !== 'undefined') {
            Dos(document.getElementById("jsdos"), {
                wd: "DDAVEVGA.zip"
            }).ready(function (fs, main) {
                main(["-c", "DAVE.EXE"]);
            });
        } else {
            document.getElementById("jsdos").innerHTML = "Error: Engine failed to load. Please refresh the page.";
        }
    </script>
</body>
</html>
